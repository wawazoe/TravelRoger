<link rel="stylesheet" href="css/record.css">

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>記録投稿</title>
</head>

<body>
    <h1>記録投稿</h1>
    <div>
        タイトル<br>
        <input type="text" id="title">
    </div>
    <br>
    <div>
        日付<br>
        <input type="date" id="event_date">
    </div>
    <br>
    <div>
        目的<br>
        <select id="purpose">
            <option value="旅行">旅行</option>
            <option value="ライブ">ライブ</option>
            <option value="観光">出張</option>
            <option value="その他">その他</option>
        </select>
    </div>
    <br>
    <div>
        場所<br>
        <input type="text" id="location">
    </div>
    <br>
    <div>
        交通手段<br>
        <input type="text" id="transportation">
    </div>
    <br>
    <div>
        感想<br>
        <textarea id="impression"></textarea>
    </div>
    <br>
    <button onclick="saveRecord()">投稿する</button>
    <script src="record.js"></script>
</body>
</html>
